<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Fatoora Demo{% endblock %}</title>
<style>
:root {
  --bg: #f5f6f8; --surface: #ffffff; --raised: #fbfbfc; --text: #151922; --muted: #5d6676;
  --border: #e2e5ea; --accent: #0e6b5c; --accent-hover: #0b574b; --accent-ink: #ffffff;
  --ok: #12703f; --ok-bg: #e6f5ec; --warn: #8a5200; --warn-bg: #fff3dd; --bad: #a3161b; --bad-bg: #fdeaea;
  --chip: #eef0f4; --shadow: 0 1px 2px rgba(16,24,40,.05), 0 1px 3px rgba(16,24,40,.06);
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1216; --surface: #171b21; --raised: #1c2128; --text: #e7eaee; --muted: #9aa3b0;
    --border: #2a3038; --accent: #2bb39a; --accent-hover: #38c7ad; --accent-ink: #06231d;
    --ok: #5fd08f; --ok-bg: #13281c; --warn: #f0b45a; --warn-bg: #2b2111; --bad: #f08a8d; --bad-bg: #2d1415;
    --chip: #222830; --shadow: none;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
.wrap { max-width: 1120px; margin: 0 auto; padding: 0 16px; }
header.top { background: var(--surface); border-bottom: 1px solid var(--border); }
header.top .wrap { display: flex; align-items: center; gap: 12px; height: 60px; }
.logo { width: 30px; height: 30px; border-radius: 8px; background: var(--accent); color: var(--accent-ink);
  display: grid; place-items: center; font-weight: 700; font-size: 14px; }
.brand { font-weight: 650; letter-spacing: -.01em; color: var(--text); }
.brand small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; margin-top: -3px; }
.spacer { flex: 1; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px;
  font-size: 12.5px; font-weight: 600; background: var(--chip); color: var(--muted); white-space: nowrap; }
.pill.ok { background: var(--ok-bg); color: var(--ok); }
.pill.warn { background: var(--warn-bg); color: var(--warn); }
.pill.bad { background: var(--bad-bg); color: var(--bad); }
.dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
main { padding: 28px 0 64px; }
h1 { font-size: 24px; letter-spacing: -.02em; margin: 0 0 4px; }
h2 { font-size: 16px; margin: 0 0 12px; }
.sub { color: var(--muted); margin: 0 0 24px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow); }
.pad { padding: 20px; }
.grid { display: grid; gap: 16px; }
.stats { grid-template-columns: repeat(4, 1fr); margin-bottom: 20px; }
.stat { padding: 16px 18px; }
.stat .n { font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.stat .l { color: var(--muted); font-size: 13px; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 20px; }
.btn { appearance: none; border: 1px solid var(--border); background: var(--surface); color: var(--text);
  padding: 9px 16px; border-radius: 9px; font: inherit; font-weight: 600; cursor: pointer; }
.btn:hover { background: var(--raised); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { background: var(--accent-hover); }
.btn[disabled] { opacity: .6; cursor: progress; }
form.inline { display: inline; margin: 0; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted);
  font-weight: 600; padding: 10px 16px; border-bottom: 1px solid var(--border); }
td { padding: 12px 16px; border-bottom: 1px solid var(--border); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
tbody tr.link { cursor: pointer; }
tbody tr.link:hover { background: var(--raised); }
.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.muted { color: var(--muted); }
.mono { font-family: var(--mono); font-size: 12.5px; word-break: break-all; }
.flash { padding: 12px 16px; border-radius: 10px; margin-bottom: 16px; font-weight: 500; }
.flash.ok { background: var(--ok-bg); color: var(--ok); }
.flash.warn { background: var(--warn-bg); color: var(--warn); }
.flash.bad { background: var(--bad-bg); color: var(--bad); }
.empty { text-align: center; padding: 48px 20px; color: var(--muted); }
.table-scroll { overflow-x: auto; }
@media (max-width: 760px) {
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .hide-sm { display: none; }
  .pill { white-space: normal; }
  th, td { padding-left: 12px; padding-right: 12px; }
}
.nowrap, header.top .pill { white-space: nowrap; }
{% block style %}{% endblock %}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <a href="{{ url_for('dashboard') }}" class="logo" aria-label="Home">F2</a>
    <a href="{{ url_for('dashboard') }}" class="brand">Fatoora Phase 2<small>E-invoicing integration demo</small></a>
    <span class="spacer"></span>
    <span class="pill warn"><span class="dot"></span>ZATCA Sandbox</span>
  </div>
</header>
<main>
  <div class="wrap">
    {% for tone, msg in get_flashed_messages(with_categories=true) %}
      <div class="flash {{ tone }}">{{ msg }}</div>
    {% endfor %}
    {% block content %}{% endblock %}
  </div>
</main>
<script>
  document.querySelectorAll("form[data-busy]").forEach(f => f.addEventListener("submit", () => {
    const b = f.querySelector("button"); b.disabled = true; b.textContent = f.dataset.busy;
  }));
</script>
</body>
</html>
